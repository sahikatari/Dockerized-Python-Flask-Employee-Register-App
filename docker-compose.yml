version: '3'

services:

  flaskapp:
    build: .
    container_name: flask_employee_app

    ports:
      - "5000:5000"

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql_container

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: employeedb

    ports:
      - "3306:3306"
